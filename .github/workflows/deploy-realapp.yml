name: Deploy Real App (auth-ON, separate surface)

# The REAL-APP surface for Rapid Site Builder — login-gated Publish + per-user
# My Sites (card VI673sym). Michal's guardrail (2026-06-16): "login gate should
# be different branch different url so hackathon url stay unrated." So this lives
# on the `real-app` branch + a SEPARATE URL and is NEVER deployed from `main`:
#   • Hackathon surface  → main → deploy.yml → rapid-builder-proxy → rapid-site-builder.web.app  (auth OFF, untouched)
#   • Real-app surface   → real-app branch → THIS workflow → rapid-builder-app → rapid-site-builder-app.web.app (auth ON)
#
# workflow_dispatch ONLY (no push trigger): pushing this branch must never
# auto-stand-up a new prod surface. A human/devops dispatches it deliberately.
#
# ── One-time prerequisites before the FIRST dispatch (devops, ~1 min) ────────
#   1. Create the Hosting site — now done idempotently inside the "Deploy Firebase
#      Hosting" step below (firebase hosting:sites:create, WIF-auth in the runner),
#      so a fresh dispatch is self-sufficient. Creating the site also auto-authorizes
#      rapid-site-builder-app.web.app for Google sign-in (Identity Platform).
#   2. Confirm the runtime SA can read the secret (rapid-builder-proxy@…staging holds
#      secretmanager.secretAccessor on rapid-builder-session-secret — verified 2026-06-29).
#   (Phase-1 prereqs already in place per card VI673sym: rapid-builder-session-secret,
#    GH secret FIREBASE_API_KEY, Google IdP enabled.)
# Final gate is operator-only: one real Google sign-in QA (the "verify it's you"
# wall can't be driven headlessly).

# ── TIER MAP (card g0pH1JZX) ────────────────────────────────────────────────
# THIS FILE IS THE **PROD** TIER: rapid-builder-app + rapid-site-builder-app,
# which is what `builder.opsagents.agency` actually serves.
# STAGING is deploy.yml -> rapid-builder-proxy + rapid-site-builder, on push:main.
# 🚨 The names read backwards — `rapid-site-builder` is STAGING. Say the TIER.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-realapp
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: rapid-builder-app
  HOSTING_SITE: rapid-site-builder-app
  APP_URL: https://rapid-site-builder-app.web.app

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, gcp]
    steps:
      # checkout MUST precede auth: checkout(clean:true) would wipe the
      # gha-creds-*.json that auth writes into the workspace.
      #
      # fetch-depth: 0 is LOAD-BEARING for the guard below, not thoroughness.
      # `git merge-base --is-ancestor` on a shallow clone exits 128 ("not a
      # valid object"), which the policy maps to cannot-verify -> REFUSE. So a
      # shallow checkout would not fail open, but it would refuse EVERY
      # dispatch including the legitimate one, and the guard would look broken
      # rather than protective.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── REF GUARD (cards 22I0yUum / eKfog19I / LEBxGF5d) ────────────────────
      # `workflow_dispatch` resolves the workflow FILE from the ref the operator
      # picks, so a guard committed to one branch only ever runs for dispatches
      # on THAT branch. This workflow's guard existed only on main, whose copy
      # expects the deploy branch — so main's copy could only ever refuse, while
      # the dispatch that actually ships PROD ran this branch's UNGUARDED copy.
      # The guard was unreachable in the allow direction and redundant in the
      # refuse direction: it had never protected a real PROD dispatch.
      #
      # This is the PROD rail (Cloud Run + update-traffic --to-latest + Firebase
      # Hosting on builder.opsagents.agency). A dispatch from any ref not on
      # this line rolls that surface backwards and reports SUCCESS.
      #
      # ⚠️ The sentence above — the other copy could only ever refuse — stopped
      # being true with the #70 ancestry merge (card 8itdTRtX): main is now an ancestor of this branch,
      # so "on the deploy line" alone would ALLOW a dispatch on main — from
      # main's copy of this file, onto PROD. The guard therefore asks a second
      # question, from the policy row: the dispatched commit must NOT be an
      # ancestor of the forbidden line (main), i.e. it must carry a commit that
      # only this line has. The same fix is on main so main's copy refuses too.
      #
      # The decision lives in lib/deployRefPolicy.js so the three-way exit code
      # (0 / 1 / anything-else) cannot be quietly collapsed into two, and so the
      # expected ref has ONE source of truth. Reusing that module rather than
      # porting a second one is deliberate: deploy-engine.yml on this branch
      # already calls it, and two policy modules serving the same call sites is
      # the duplication this card series exists to shrink.
      #
      # No `if:` — this workflow has no trigger other than workflow_dispatch, so
      # every run of it is the case the guard is for. (And a job-level `if:`
      # would make every `needs:` job skip while the run shows no failure.)
      - name: Refuse a dispatch on any ref that is not on the deploy line
        id: refguard
        # REF_NAME goes through env:, never inline `${{ }}` in the run: body —
        # a branch name may legally contain `$`, backticks and parentheses.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          EXPECTED=$(node -p "require('./lib/deployRefPolicy').DEPLOY_REF_POLICY['deploy-realapp.yml'].expectedRef")
          FORBIDDEN=$(node -p "require('./lib/deployRefPolicy').DEPLOY_REF_POLICY['deploy-realapp.yml'].mustNotBeAncestorOf.join(' ')")
          for REF in $EXPECTED $FORBIDDEN; do
            git rev-parse --verify --quiet "refs/remotes/origin/$REF" >/dev/null 2>&1 \
              || git fetch --no-tags --quiet origin "+refs/heads/$REF:refs/remotes/origin/$REF" \
              || true
          done
          # `|| rc=$?` is LOAD-BEARING: GitHub runs this under `bash -e`, so a
          # bare `--is-ancestor` returning 1 aborts the step before the message
          # naming the right ref is ever printed.
          rc=0
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$EXPECTED" || rc=$?
          echo "git merge-base --is-ancestor HEAD origin/$EXPECTED -> exit $rc"
          # SECOND HALF (card 8itdTRtX): once the deploy line contains the other
          # line, being on the deploy line no longer tells the two apart. Each
          # forbidden line the policy row names is probed the same way, and the
          # exit codes travel to the decision as REF=CODE pairs — a probe the
          # policy requires and does not receive is CANNOT VERIFY, not allow.
          PROBES=""
          for REF in $FORBIDDEN; do
            frc=0
            git merge-base --is-ancestor HEAD "refs/remotes/origin/$REF" || frc=$?
            echo "git merge-base --is-ancestor HEAD origin/$REF -> exit $frc"
            PROBES="$PROBES $REF=$frc"
          done
          RC="$rc" RC_FORBIDDEN="$PROBES" node -e '
            const { refDeployVerdict, parseForbiddenProbes, DEPLOY_REF_POLICY } = require("./lib/deployRefPolicy");
            const p = DEPLOY_REF_POLICY["deploy-realapp.yml"];
            const v = refDeployVerdict(process.env.RC, {
              workflow: "deploy-realapp.yml",
              dispatchedRef: process.env.REF_NAME,
              expectedRef: p.expectedRef,
              tier: p.tier,
              forbidden: parseForbiddenProbes(process.env.RC_FORBIDDEN),
            });
            console.log(v.message);
            if (!v.allow) { console.log("::error::" + v.message); process.exit(1); }
          '

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Run (auth ON)
        run: |
          # ⚠️ --update-env-vars, NOT --set-env-vars (rule #20, card g0pH1JZX).
          #
          # This line WAS --set-env-vars, which REPLACES. Diffed against the live
          # service on 2026-08-21 (`gcloud run services describe rapid-builder-app`),
          # it carried 14 keys while the service carries 17 — so the next dispatch
          # would have DELETED three that nothing here sets:
          #     PAID_TIER_UIDS          <- paid users lose their entitlement
          #     FIREBASE_HOSTING_SITE
          #     FIREBASE_HOSTING_PROJECT
          # SESSION_SECRET survived only because --set-secrets below names it.
          #
          # --update-env-vars MERGES: it writes the keys named here and leaves
          # every other key on the service alone. That is the correct tool for a
          # deploy that does not own the full env set — and this one does not,
          # because PAID_TIER_UIDS is edited operationally, not in this file.
          #
          # Union note (xe1q8uHa reconciliation): FIREBASE_HOSTING_SITE /
          # FIREBASE_HOSTING_PROJECT ARE owned here — the connect-your-domain
          # routes (card DYE9159z) fail closed without them — and
          # GA4_MEASUREMENT_ID is owned here because the reconciliation removed
          # the inline gtag snippet from web/*.html in favour of the
          # observability adapter, which reads it from /api/client-config
          # (server env). G-8ZV9B6NH11 is the existing PROD measurement ID that
          # was hardcoded in those pages (property 549064186, stream
          # builder.opsagents.agency) — carried forward, not invented.
          # PAID_TIER_UIDS stays operator-managed: unset in the workflow, its
          # live value is untouched by --update-env-vars.
          #
          # The ^|^ delimiter is required: ALLOWED_ORIGINS contains a comma, and
          # under the default delimiter gcloud reads it as more env-var pairs
          # ("Bad syntax for dict arg"). Same reason deploy.yml uses it.
          #
          # The auth vars that flip
          # AUTH_ENABLED on (FIREBASE_PROJECT_ID + FIREBASE_API_KEY + SESSION_SECRET;
          # FIREBASE_AUTH_DOMAIN = opsagent-staging.firebaseapp.com (the project default).
          # Its /__/auth/handler redirect URI is pre-registered on the auto-provisioned
          # Google OAuth client; pinning the app domain instead needs that redirect URI added
          # to the OAuth client by hand (no API) and 404s sign-in until then — verified
          # 2026-06-30 (auth/unauthorized-domain → redirect_uri_mismatch). SESSION_SECRET
          # comes from Secret Manager, never an env literal.
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "${{ secrets.RUN_SERVICE_ACCOUNT }}" \
            --allow-unauthenticated \
            --memory 1Gi --cpu 2 --cpu-boost --timeout 600 --min-instances 1 --max-instances 20 \
            --update-env-vars "^|^AGENT_ENGINE_RESOURCE=${{ secrets.AGENT_ENGINE_RESOURCE }}|SITE_IMAGES_BUCKET=${{ secrets.SITE_IMAGES_BUCKET }}|PUBLISHED_SITES_BUCKET=${{ secrets.PUBLISHED_SITES_BUCKET }}|USER_UPLOADS_BUCKET=${{ secrets.USER_UPLOADS_BUCKET }}|IMAGE_PROJECT=${{ secrets.IMAGE_PROJECT }}|IMAGE_REGION=global|IMAGE_MODEL=gemini-3-pro-image-preview|WARM_KEY=${{ secrets.WARM_KEY }}|FIREBASE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}|FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}|FIREBASE_AUTH_DOMAIN=opsagent-staging.firebaseapp.com|PUBLIC_BASE_URL=https://builder.opsagents.agency|PUBLIC_MEDIA_BASE_URL=${{ secrets.PUBLIC_MEDIA_BASE_URL }}|ALLOWED_ORIGINS=https://builder.opsagents.agency,https://rapid-site-builder-app.web.app|FIREBASE_HOSTING_SITE=${{ env.HOSTING_SITE }}|FIREBASE_HOSTING_PROJECT=${{ secrets.GCP_PROJECT_ID }}|GA4_MEASUREMENT_ID=G-8ZV9B6NH11" \
            --set-secrets "SESSION_SECRET=rapid-builder-session-secret:latest" \
            --quiet
          # deploy does not promote traffic when a pin exists — promote explicitly
          gcloud run services update-traffic "$SERVICE" --to-latest \
            --project "$PROJECT_ID" --region "$REGION" --quiet

      - name: Smoke test Cloud Run (expect auth ON)
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          echo "Service URL: $URL"
          curl -sf "$URL/api/health" | tee /tmp/health.json
          grep -q '"agentEngine":true' /tmp/health.json
          # the real-app surface MUST report auth enabled (fail-closed safety net:
          # a deploy that silently lost the auth env would otherwise publish ungated)
          grep -q '"auth":true' /tmp/health.json
          # customDomains MUST report true (card DYE9159z standing rule: a deploy
          # that exists to flip an env-gated boolean asserts that boolean — a green
          # deploy says nothing about the feature). FIREBASE_HOSTING_SITE is wired
          # above; an empty value renders customDomains:false with no error.
          grep -q '"customDomains":true' /tmp/health.json

      - name: Deploy Firebase Hosting (separate site, via Cloud Build native ADC)
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          sed -i "s#__API_BASE__#$URL#g" web/index.html web/board/board.js
          # firebase-tools (Node google-auth) cannot consume the WIF external_account
          # credential on the runner — it fails "Failed to authenticate" deterministically.
          # So gcloud (WIF works on the runner) submits a Cloud Build that runs the hosting
          # deploy INSIDE GCP via metadata ADC (build SA gha-deployer@opsagent-staging,
          # firebase.admin). The config is SCOPED to rapid-site-builder-app only, so the
          # hackathon sites stay untouched. Mirrors deploy.yml's cloudbuild-hosting.yaml.
          gcloud builds submit . \
            --project "$PROJECT_ID" \
            --config=cloudbuild-realapp-hosting.yaml \
            --service-account="projects/$PROJECT_ID/serviceAccounts/gha-deployer@opsagent-staging.iam.gserviceaccount.com"

      - name: Smoke test Hosting
        run: |
          sleep 5
          curl -sf -o /dev/null -w "hosting: %{http_code}\n" "$APP_URL/api/health"

      # ── PROVENANCE (cards 22I0yUum / eKfog19I) ─────────────────────────────
      # The PROD surface's URL is stable, so after the fact nothing in the run
      # says WHICH commit is live behind it. This records that, and `always()`
      # so a REFUSED or FAILED dispatch still leaves a record — that is exactly
      # when someone goes looking.
      #
      # ⚠️ THE WORDING READS THE GUARD'S ACTUAL VERDICT, and that is the whole
      # point of the step rather than a detail. Card QpERt8db measured the
      # sibling block on deploy-engine.yml printing
      #   "expected: main (ancestry verified by the ref guard …)"
      # on a run where the guard had REFUSED and nothing was deployed — false on
      # 100% of dispatches from the refused ref. An authoritative-looking record
      # that is not true is the same harm eKfog19I was filed about, one level
      # down. So this block ships correct from birth: `steps.refguard.outcome`
      # decides, and on a refusal it prints no line that reads like a receipt.
      #
      # Do NOT "fix" a future issue here by dropping always() — that trades a
      # false record for NO record on precisely the runs it exists to serve.
      - name: Record what this PROD surface was deployed from
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          GUARD: ${{ steps.refguard.outcome }}
        run: |
          EXPECTED=$(node -p "require('./lib/deployRefPolicy').DEPLOY_REF_POLICY['deploy-realapp.yml'].expectedRef")
          echo "--- real-app provenance (cards 22I0yUum / eKfog19I) ---"
          echo "ref       : $REF_NAME"
          echo "ref check : $GUARD (expected ref: $EXPECTED)"
          if [ "$GUARD" != "success" ]; then
            echo "RESULT    : REFUSED or NOT RUN — nothing was deployed from this run."
            echo "            No commit is recorded here on purpose: printing one would read"
            echo "            like a deploy receipt for a deploy that did not happen."
            exit 0
          fi
          echo "commit    : $SHA"
          echo "ancestry  : verified by the ref guard at the top of this job"
          echo "app       : $(git log -1 --format='%h %ci %s')"
          echo "Pin the URL above together with this commit."
