name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: rapid-builder-proxy
  HOSTING_SITE: rapid-site-builder

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # checkout MUST precede auth: checkout(clean:true) would wipe the
      # gha-creds-*.json that auth writes into the workspace.
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Run
        run: |
          # --set-env-vars uses a custom delimiter (^|^) so the comma-separated
          # ALLOWED_ORIGINS value is NOT mis-parsed as additional env-var pairs.
          # With the default comma delimiter, a 2nd allowed origin breaks gcloud
          # ("Bad syntax for dict arg"). See gcloud topic escaping. Full canonical
          # env list (rule #20: --set-env-vars REPLACES — every key must be present).
          #
          # --min-instances 0 (card KjHpbn3J step 4, the safe half): this service
          # now backs only the RETIRED hackathon surfaces — every interactive
          # route on them is 410/301, so all it still serves is published demo
          # sites at /sites/**. Paying for a warm instance around the clock to
          # hold open a surface whose whole purpose is to redirect elsewhere is
          # the cost this card set out to stop. A cold start on a static
          # published page is the right trade; --cpu-boost covers it.
          #
          # ⚠️ NEVER put a comment BETWEEN two backslash-continued lines. bash
          # splices `\`+newline before word-splitting, so the `#` opens a comment
          # whose own unescaped newline ENDS the command — leaving a valid
          # `gcloud run deploy … --allow-unauthenticated` with no --set-env-vars,
          # which under rule #20 wipes every env key on the service. That is
          # exactly what this file did until card rFZrx6fL; `bash -n` exits 0 on
          # it, and the ci.yml `workflows` job is the only thing that sees it.
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "${{ secrets.RUN_SERVICE_ACCOUNT }}" \
            --allow-unauthenticated \
            --memory 1Gi --cpu 2 --cpu-boost --timeout 600 --min-instances 0 --max-instances 20 \
            --set-env-vars "^|^AGENT_ENGINE_RESOURCE=${{ secrets.AGENT_ENGINE_RESOURCE }}|SITE_IMAGES_BUCKET=${{ secrets.SITE_IMAGES_BUCKET }}|PUBLISHED_SITES_BUCKET=${{ secrets.PUBLISHED_SITES_BUCKET }}|USER_UPLOADS_BUCKET=${{ secrets.USER_UPLOADS_BUCKET }}|IMAGE_PROJECT=${{ secrets.IMAGE_PROJECT }}|IMAGE_REGION=global|IMAGE_MODEL=gemini-3-pro-image-preview|WARM_KEY=${{ secrets.WARM_KEY }}|PUBLIC_BASE_URL=https://rapid-site-builder.web.app|PUBLIC_MEDIA_BASE_URL=${{ secrets.PUBLIC_MEDIA_BASE_URL }}|ALLOWED_ORIGINS=https://rapid-site-builder.web.app,https://rapid-site-builder-he.web.app|GA4_MEASUREMENT_ID=G-T8S1JFMTH3|RETIRE_UNGATED=1|CANONICAL_APP_URL=https://builder.opsagents.agency" \
            --quiet
          # deploy does not promote traffic when a pin exists — promote explicitly
          gcloud run services update-traffic "$SERVICE" --to-latest \
            --project "$PROJECT_ID" --region "$REGION" --quiet

      - name: Smoke test Cloud Run
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          echo "Service URL: $URL"
          curl -sf "$URL/api/health" | tee /tmp/health.json
          grep -q '"agentEngine":true' /tmp/health.json

      - name: Deploy Firebase Hosting via Cloud Build (native metadata ADC)
        run: |
          # Bake the Cloud Run URL into the static pages (long SSE builds bypass the
          # Hosting proxy 60s cap), THEN ship the baked source to Cloud Build.
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          sed -i "s#__API_BASE__#$URL#g" web/index.html web/board/board.js
          # firebase-tools (Node google-auth) CANNOT consume the WIF external_account
          # credential on a GitHub-hosted runner — it fails "Failed to authenticate"
          # DETERMINISTICALLY (gcloud/curl mint tokens from the same runner fine; only the
          # Node CLIs fail). So gcloud (WIF works on the runner) submits a Cloud Build that
          # runs the hosting deploy INSIDE GCP via metadata-server ADC — the failure class
          # disappears. Mirrors OpsAgentsAI/msapps-lead-pipeline (card 7RuzMRm0). Build runs
          # as gha-deployer@opsagent-staging (firebase.admin); see cloudbuild-hosting.yaml.
          gcloud builds submit . \
            --project "$PROJECT_ID" \
            --config=cloudbuild-hosting.yaml \
            --service-account="projects/$PROJECT_ID/serviceAccounts/gha-deployer@opsagent-staging.iam.gserviceaccount.com"

      - name: Smoke test Hosting
        run: |
          sleep 5
          curl -sf -o /dev/null -w "hosting: %{http_code}\n" "https://rapid-site-builder.web.app/api/health"

      # Card KjHpbn3J: the retirement is currently held up by ONE token —
      # `RETIRE_UNGATED=1`, sitting inside a fifteen-variable single-line
      # --set-env-vars above. Rule #20 means that line is rewritten in full on
      # every deploy, so dropping that one token is a plausible edit — and if it
      # went, anonymous /api/build would quietly start answering again, burning
      # engine spend on a surface Michal retired on 2026-07-17, with every
      # signal in this workflow still green. Nothing checked. Now something does.
      #
      # Asserted from the OUTSIDE, against the live hosts, after the deploy —
      # not by grepping the env line, which would only prove we wrote the token,
      # not that the running service honours it.
      - name: Verify the retired surfaces stay retired
        run: |
          set -euo pipefail
          CANON="https://builder.opsagents.agency"
          fail=0
          for host in rapid-site-builder rapid-site-builder-he; do
            # Anonymous engine endpoints must be GONE.
            for p in /api/build /api/publish /api/ask /api/import-site; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$host.web.app$p")
              if [ "$code" != "410" ]; then
                echo "::error::https://$host.web.app$p answered $code, expected 410 — the ungated engine is REACHABLE again (card KjHpbn3J). Check RETIRE_UNGATED=1 survived the --set-env-vars rewrite."
                fail=1
              fi
            done
            # The launch posts (LinkedIn, X, YouTube, the GitHub release) all
            # link the old URLs. They must REDIRECT, never 404.
            for p in / /board /campfire; do
              got=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "https://$host.web.app$p")
              case "$got" in
                301\ ${CANON}*) : ;;
                *) echo "::error::https://$host.web.app$p gave '$got', expected a 301 to $CANON — a launch-post link is broken (card KjHpbn3J)."; fail=1 ;;
              esac
            done
            # Published demo sites must keep resolving: /sites/** is the one path
            # still served here, and the card's AC says public links must not
            # break. A 301 or a 5xx here means the teardown went too far.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://$host.web.app/sites/__ci_probe_nonexistent__")
            if [ "$code" != "404" ]; then
              echo "::error::https://$host.web.app/sites/** answered $code, expected 404 from the app — published demo sites are no longer being served (card KjHpbn3J AC3)."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
          echo "✅ both retired surfaces: engine 410, launch links 301, /sites/** still served."
