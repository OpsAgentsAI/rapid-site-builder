name: Deploy Agent Engine

# Bakes the builder crew onto a NEW Vertex AI Agent Engine (every run mints a
# fresh engine ID — pin the printed RESOURCE_NAME in the app's env and prune
# stale engines later). Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      builder_model:
        description: "Gemini model for every agent in the crew"
        required: true
        default: "gemini-3-flash-preview"
      use_global:
        description: "Route model calls via the global endpoint (required for Gemini 3 previews)"
        required: true
        default: "1"

permissions:
  contents: read
  id-token: write

jobs:
  deploy-engine:
    runs-on: [self-hosted, linux, x64, gcp]
    # Card mwHId6GR: a pool job without a bound can hold a shared runner (and its WIF
    # identity) until the 6 h GitHub default. 30 min is ample for the checkout, the
    # pip install and one Agent Engine bake.
    timeout-minutes: 30
    steps:
      # checkout MUST precede auth (checkout clean:true wipes the creds file)
      #
      # fetch-depth: 0 is LOAD-BEARING for the ref guard below, not a nicety.
      # The default depth-1 clone has no history and no `main` ref, so
      # `merge-base --is-ancestor` exits 128 and the guard aborts every dispatch
      # — including correct ones. Card eKfog19I; a test asserts this value.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── REF GUARD (cards eKfog19I / OtEgCdjR) — BEFORE auth, BEFORE deploy ──
      # This workflow is dispatch-only and mints a **NEW** engine every run
      # rather than updating one, then prints a RESOURCE_NAME a human pins into
      # the app's env. So a stale-ref dispatch does not merely deploy wrong: it
      # hands you an identifier that looks authoritative.
      #
      # ⭐ WHY THIS BLOCK IS ON `real-app` AND NOT ONLY ON `main` (card OtEgCdjR).
      # `workflow_dispatch` resolves the workflow FILE from the ref the operator
      # picks. So main's copy of this guard only ever runs on a dispatch from
      # main — the one ref it would allow. A dispatch from `real-app` ran THIS
      # file, which had no guard at all, and minted an engine from a branch
      # whose crew is three sub-agents short. A guard that lives only on the
      # ref it permits cannot refuse anything.
      #
      # `main` owns the crew definition — RE-MEASURED 2026-09-08 for this
      # branch rather than copied from main's row:
      #     agents/ diff real-app..main   +156 / -3   (agent.py, tools.py)
      #     Dana/Remy/Kai sub-agents      main 12 matches · real-app 0
      #     last touched agents/          main e79c7b7 2026-08-07
      #                                   real-app 308dae6 2026-06-14
      #     ancestry                      neither branch is an ancestor of the
      #                                   other, so a real-app dispatch REFUSES
      # ⚠️ That last line is the point, and it is intended: with this guard in
      # place, dispatching this workflow from `real-app` is refused with the
      # message naming `main`. Engines are minted from `main` only.
      #
      # ⚠️ main's policy row says real-app last touched agents/ on 2026-07-20.
      # Measured today it is 2026-06-14 (308dae6) — real-app is ~3 months
      # behind, not ~6 weeks. The row's conclusion is unchanged and stronger;
      # the date is corrected in lib/deployRefPolicy.js in this same commit.
      #
      # No `if:` — this workflow has no trigger other than workflow_dispatch, so
      # every run of it is the case the guard is for. (And a job-level `if:`
      # would make every `needs:` job skip while the run shows no failure.)
      - name: Refuse a dispatch on any ref that is not on the main line
        # Card QpERt8db: the PROVENANCE step below reads this step's outcome by
        # id. Without the id it asserted "ancestry verified" unconditionally,
        # which is false on 100% of real-app dispatches (the guard can only
        # refuse here) — an authoritative record of a mint that never happened.
        id: refguard
        # REF_NAME goes through env:, never inline `${{ }}` in the run: body —
        # a branch name may legally contain `$`, backticks and parentheses.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          EXPECTED=$(node -p "require('./lib/deployRefPolicy').DEPLOY_REF_POLICY['deploy-engine.yml'].expectedRef")
          FORBIDDEN=$(node -p "require('./lib/deployRefPolicy').DEPLOY_REF_POLICY['deploy-engine.yml'].mustNotBeAncestorOf.join(' ')")
          for REF in $EXPECTED $FORBIDDEN; do
            git rev-parse --verify --quiet "refs/remotes/origin/$REF" >/dev/null 2>&1 \
              || git fetch --no-tags --quiet origin "+refs/heads/$REF:refs/remotes/origin/$REF" \
              || true
          done
          # `|| rc=$?` is LOAD-BEARING: GitHub runs this under `bash -e`, so a
          # bare `--is-ancestor` returning 1 aborts the step before the message
          # naming the right ref is ever printed.
          rc=0
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$EXPECTED" || rc=$?
          echo "git merge-base --is-ancestor HEAD origin/$EXPECTED -> exit $rc"
          # SECOND HALF (card 8itdTRtX): once the deploy line contains the other
          # line, being on the deploy line no longer tells the two apart. Each
          # forbidden line the policy row names is probed the same way, and the
          # exit codes travel to the decision as REF=CODE pairs — a probe the
          # policy requires and does not receive is CANNOT VERIFY, not allow.
          # (This row names none today; the loop is the shape every guard shares.)
          PROBES=""
          for REF in $FORBIDDEN; do
            frc=0
            git merge-base --is-ancestor HEAD "refs/remotes/origin/$REF" || frc=$?
            echo "git merge-base --is-ancestor HEAD origin/$REF -> exit $frc"
            PROBES="$PROBES $REF=$frc"
          done
          RC="$rc" RC_FORBIDDEN="$PROBES" node -e '
            const { refDeployVerdict, parseForbiddenProbes, DEPLOY_REF_POLICY } = require("./lib/deployRefPolicy");
            const p = DEPLOY_REF_POLICY["deploy-engine.yml"];
            const v = refDeployVerdict(process.env.RC, {
              workflow: "deploy-engine.yml",
              dispatchedRef: process.env.REF_NAME,
              expectedRef: p.expectedRef,
              tier: p.tier,
              forbidden: parseForbiddenProbes(process.env.RC_FORBIDDEN),
            });
            console.log(v.message);
            if (!v.allow) { console.log("::error::" + v.message); process.exit(1); }
          '

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        run: pip install -r agents/requirements.txt

      - name: Deploy crew to Agent Engine
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.IMAGE_PROJECT }}
          GOOGLE_CLOUD_LOCATION: us-central1
          AGENT_ENGINE_STAGING_BUCKET: gs://opsagent-prod-agent-engine-staging
          BUILDER_MODEL: ${{ inputs.builder_model }}
          BUILDER_USE_GLOBAL: ${{ inputs.use_global }}
        run: |
          # Arize Phoenix MCP wiring (partner integration) — values stay in
          # Secret Manager; only this runner ever sees them.
          # Assign THEN export (SC2155). `export X="$(cmd)"` returns the exit
          # status of `export`, which always succeeds — so a failed secrets
          # fetch under `set -e` would sail past with X set to the empty string
          # and the deploy would run unwired. Split, the failure aborts the step.
          #
          # ⭐ This fix has been on `main` since card eKfog19I. It never reached
          # `real-app` — the auth-ON PRODUCTION branch — because `real-app` has
          # no workflow linter, which is the gap card K5YgkNtO is about. The
          # `workflows` job added to ci-realapp.yml in this same PR is what
          # would have caught it, and does catch it: actionlint on this branch
          # exits 1 on these two lines today.
          ARIZE_MCP_URL="$(gcloud secrets versions access latest --secret=arize-mcp-url --project="$GOOGLE_CLOUD_PROJECT")"
          ARIZE_MCP_API_KEY="$(gcloud secrets versions access latest --secret=arize-mcp-api-key --project="$GOOGLE_CLOUD_PROJECT")"
          export ARIZE_MCP_URL ARIZE_MCP_API_KEY
          python scripts/deploy_agent_engine.py

      # ── PROVENANCE (cards eKfog19I / OtEgCdjR) ─────────────────────────────
      # The guard above already refuses an off-line ref, so this cannot be the
      # only defence — it is the half the card asks for explicitly: the
      # RESOURCE_NAME printed by the step above is copied by a human into the
      # app's env, and until now it arrived with NO indication of which commit
      # produced it. A bare engine id is unfalsifiable after the fact.
      #
      # `if: always()` so a FAILED deploy still records what it was built from —
      # that is exactly when someone goes looking.
      - name: Record what the engine above was minted from
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          # Card QpERt8db. `outcome`, not `conclusion`: outcome is the step's
          # own result before continue-on-error is applied. The guard carries no
          # continue-on-error today, so they agree — reading outcome keeps that
          # true if one is ever added.
          REFGUARD: ${{ steps.refguard.outcome }}
        run: |
          EXPECTED=$(node -p "require('./lib/deployRefPolicy').DEPLOY_REF_POLICY['deploy-engine.yml'].expectedRef")
          echo "--- engine provenance (card eKfog19I) ---"
          # THREE states, never two. A step that was cancelled or skipped is not
          # a refusal and is certainly not a verification — and a timed-out job
          # concludes `cancelled`, so "not success" and "refused" are different
          # facts. Only `success` may claim ancestry was verified.
          case "$REFGUARD" in
            success)
              echo "ref check: VERIFIED — HEAD is an ancestor of $EXPECTED"
              echo "ref     : $REF_NAME"
              echo "commit  : $SHA"
              echo "expected: $EXPECTED"
              echo "crew    : $(git log -1 --format='%h %ci %s' -- agents/ scripts/deploy_agent_engine.py)"
              echo "Pin the RESOURCE_NAME printed above together with this commit."
              ;;
            failure)
              echo "ref check: REFUSED — NO ENGINE WAS MINTED from this run."
              echo "dispatched ref   : $REF_NAME"
              echo "dispatched commit: $SHA"
              echo "expected ref     : $EXPECTED"
              echo "This run produced no RESOURCE_NAME. Do not pin anything from it."
              ;;
            *)
              echo "ref check: UNKNOWN (guard outcome: '$REFGUARD') — cannot state whether ancestry was verified."
              echo "dispatched ref   : $REF_NAME"
              echo "dispatched commit: $SHA"
              echo "expected ref     : $EXPECTED"
              echo "Treat this run as UNVERIFIED. Do not pin a RESOURCE_NAME from it."
              ;;
          esac
