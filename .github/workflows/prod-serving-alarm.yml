name: Prod-serving alarm (is what production serves current with real-app)

# Card 65pcQtze — GAP B. The divergence alarm is titled "merged work that cannot
# reach PROD" but compares two git REFS (main -> real-app). Nothing measured
# whether PRODUCTION had received real-app's head, and on 2026-09-15 it had not:
# the last successful deploy-realapp run was 2026-08-17.
#
# ── WHY A SEPARATE WORKFLOW, NOT A STEP IN divergence-alarm.yml ─────────────
# AC-2: gaps A and B must be reported SEPARATELY. The divergence alarm is red for
# gap A, persistently, and a gap-B failure folded into that red is invisible —
# which is precisely how a 29-day-old deploy went unnamed. A separate workflow
# gives gap B its own run history, its own red, and its own title.
# It also keeps this change off the two files open PR #88 carries.
#
# ── THE TITLE IS THE PREDICATE ──────────────────────────────────────────────
# AC-4, applied to THIS alarm: the name above asks exactly what
# scripts/check-prod-serving.js answers — nothing more. (The divergence alarm's
# own over-promising title is AC-4 for THAT file, deferred until PR #88 settles.)
#
# ⚠️ HONEST SCOPE: this reds in the Actions tab and writes a job summary. It does
# NOT yet open/update/close a GitHub issue the way divergence-alarm.yml does, and
# a red nobody reads is not an audience (card xe1q8uHa's own lesson). Routing is
# the named follow-up, not an oversight.

on:
  schedule:
    # 06:47 UTC daily — off the hour, and 30 minutes after the divergence alarm
    # (06:17) so the two never contend for the same queue slot.
    - cron: '47 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # LOAD-BEARING on a PRIVATE repo — reading deploy-realapp.yml's run history
  # needs the actions scope. divergence-alarm.yml measured the 403 without it.
  actions: read

concurrency:
  group: prod-serving-alarm
  cancel-in-progress: false

jobs:
  check:
    # ⚠️ The POOL, like every other job in this repo. Shipped as `ubuntu-latest`
    # and caught in review (card 65pcQtze bounce, 2026-09-20): hosted minutes are
    # dark by standing decision, so this alarm would have taken a 0-step lockout
    # on its 06:47 schedule every morning and measured NOTHING.
    #
    # That is not a generic CI nit — it is this card's own pathology one layer
    # down. The card exists because the sibling divergence alarm is permanently
    # red for gap A and therefore says nothing about gap B. Shipping a gap-B
    # alarm that cannot fire would have replaced "an alarm that measures the
    # wrong thing" with "an alarm that measures nothing", and closed the card on
    # a signal incapable of reporting.
    #
    # Nothing holds it hosted: no WIF, no repo secrets — its only credential is
    # the per-job `github.token`, which all 12 sibling pool jobs also carry.
    # Card ZikVJXBp (2026-09-28): this repo is PUBLIC, and runner group `gcp-selfhosted` has
    # allows_public_repositories=false, so GitHub never routes a public repo's job to the pool.
    # Every pool job here sat `queued` with no runner from 09-18 on. GitHub-hosted minutes are
    # FREE for public repos (not metered, so the hosted-minutes lock does not apply). Proof:
    # `CI (real-app)` run 36416903247 went green on ubuntu-latest on 2026-09-28. This job holds
    # no credential, so a fresh hosted VM is also the most isolated place to run it.
    # The pool-portable steps below ($RUNNER_TEMP installs, setup-node) work unchanged here.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ⚠️ LOAD-BEARING, and the reason this alarm measured NOTHING for two runs.
      # The pool image has no node on PATH — divergence-alarm.yml records the same
      # probe ("gha-runner-1: `command -v node` -> MISSING") and carries this step
      # for the same reason. Without it the measure step below dies at
      # `node: command not found`, exit 127, BEFORE the script runs.
      #
      # 127 is not one of this alarm's verdicts. check-prod-serving.js exits
      # 1 = STALE and 2 = UNKNOWN, both red on purpose; 127 is the runner saying
      # the program never started, and in the Actions tab it looks identical to a
      # measurement that ran. Measured on both runs the alarm has ever had:
      # 35713932198 (dispatch, 2026-09-22 10:04Z) and 35725033827 (its own cron,
      # 12:04Z), each dead at the measure step.
      #
      # A per-file fix would leave the class intact, so the class is pinned by
      # test/pool-node-setup.test.js: every pool job that shells out to node must
      # set node up FIRST. The ORDER is part of the rule — setup-node only mutates
      # PATH for the steps that follow it.
      - name: Set up Node (absent from the self-hosted pool image)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Measure gap B (real-app -> what production serves)
        env:
          GH_TOKEN: ${{ github.token }}
        # Exit 1 = STALE, 2 = UNKNOWN. Both red on purpose: "could not read the
        # deploy history" must never render as "production is current".
        run: node scripts/check-prod-serving.js
